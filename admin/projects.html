<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../cms-cloud.js"></script>
<script src="auth-gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Projects · CMS — Hasan Waulat</title>
<meta name="description" content="Edit project cards and detail pages." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .admin-shell { padding-top: 80px; display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
  .admin-side {
    border-right: 1px solid var(--border);
    padding: 24px 18px;
    background: color-mix(in oklab, var(--paper) 60%, var(--bg));
    overflow-y: auto;
    max-height: calc(100vh - 80px);
    position: sticky; top: 80px;
  }
  .admin-main { padding: 28px 36px 80px; overflow-y: auto; max-width: 980px; }
  .side-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .side-head h2 { font-family: var(--font-sans); font-size: 22px; margin: 0; font-weight: 600; }
  .side-head .count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.12em; }
  .toolbar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .toolbar .btn { width: 100%; justify-content: center; }
  .toolbar-row { display: flex; gap: 8px; }
  .toolbar-row .btn { flex: 1; padding: 8px 10px; font-size: 12px; }
  .sidelist {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  .sidelist li {
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 4px;
    padding: 10px 12px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: all 180ms ease;
    position: relative;
  }
  .sidelist li:hover { border-color: var(--fg); }
  .sidelist li.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .sidelist li.active .meta { color: color-mix(in oklab, var(--bg) 60%, transparent); }
  .sidelist li .num { font-family: var(--font-mono); font-size: 10px; color: var(--accent); letter-spacing: 0.12em; min-width: 22px; }
  .sidelist li.active .num { color: var(--bg); }
  .sidelist li .body { flex: 1; min-width: 0; }
  .sidelist li .title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidelist li .meta { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidelist li .star { color: var(--accent); font-size: 11px; }
  .sidelist li.active .star { color: #ffd86b; }

  .admin-main h1 { font-family: var(--font-sans); font-weight: 600; font-size: 36px; letter-spacing: -0.01em; margin: 0 0 6px; }
  .admin-main .crumbs { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
  .admin-main .status { font-size: 13px; color: var(--accent); margin-bottom: 24px; min-height: 18px; }

  .panel { border: 1px solid var(--border); background: var(--card); border-radius: 6px; margin-bottom: 18px; }
  .panel-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-head h3 { font-family: var(--font-sans); font-weight: 600; font-size: 18px; margin: 0; letter-spacing: -0.005em; }
  .panel-head .hint { font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
  .panel-body { padding: 20px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-2 .full, .grid-3 .full { grid-column: 1 / -1; }

  .fld { display: flex; flex-direction: column; gap: 6px; }
  .fld label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .fld input, .fld textarea, .fld select {
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 12px; font: inherit; font-size: 14px; outline: none;
    transition: border-color 160ms ease;
  }
  .fld input:focus, .fld textarea:focus, .fld select:focus { border-color: var(--accent); }
  .fld textarea { min-height: 90px; resize: vertical; font-family: inherit; }
  .fld .help { font-size: 11px; color: var(--muted); }

  .toggle { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); }
  .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
  .toggle label { font-size: 13px; cursor: pointer; }
  .toggle .desc { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .image-slot {
    border: 2px dashed var(--border); border-radius: 6px; padding: 24px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    transition: border-color 160ms ease, background 160ms ease;
    cursor: pointer; position: relative;
    min-height: 160px;
    justify-content: center;
  }
  .image-slot:hover { border-color: var(--accent); background: var(--accent-soft); }
  .image-slot.has-image { padding: 0; border-style: solid; }
  .image-slot.dragover { border-color: var(--accent); background: var(--accent-soft); }
  .image-slot img { max-width: 100%; max-height: 240px; display: block; border-radius: 4px; }
  .image-slot input[type=file] { display: none; }
  .image-slot .placeholder { color: var(--muted); font-size: 13px; }
  .image-slot .placeholder small { display: block; margin-top: 4px; font-size: 11px; font-family: var(--font-mono); letter-spacing: 0.06em; }
  .image-slot .remove-btn {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    width: 26px; height: 26px; border-radius: 999px; background: var(--fg); color: var(--bg); border: 0;
    cursor: pointer; display: grid; place-items: center; font-size: 12px;
    opacity: 0; transition: opacity 160ms ease;
  }
  .image-slot.has-image:hover .remove-btn { opacity: 1; }

  .section-editor {
    border: 1px solid var(--border); border-radius: 4px; padding: 14px; margin-bottom: 12px; background: var(--bg);
  }
  .section-editor .se-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .section-editor .se-head select { font: inherit; font-size: 12px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card); color: var(--fg); }
  .section-editor .se-head input { flex: 1; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--card); color: var(--fg); }
  .section-editor .se-head .icon-btn { width: 30px; height: 30px; flex-shrink: 0; }
  .section-editor textarea { width: 100%; box-sizing: border-box; min-height: 70px; padding: 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--card); color: var(--fg); font: inherit; font-size: 13px; resize: vertical; }
  .section-editor .list-rows { display: flex; flex-direction: column; gap: 6px; }
  .section-editor .list-row { display: flex; gap: 6px; }
  .section-editor .list-row input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--card); color: var(--fg); font: inherit; font-size: 13px; }
  .section-editor .list-row button { padding: 6px 10px; background: transparent; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .section-editor .list-row button:hover { color: var(--fg); border-color: var(--fg); }
  .add-row { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent); cursor: pointer; padding: 6px 10px; border: 1px dashed var(--border); border-radius: 4px; background: transparent; margin-top: 6px; }
  .add-row:hover { border-color: var(--accent); }

  /* Gallery Dropzone & Multi-upload */
  .gallery-dropzone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 24px 20px;
    text-align: center;
    background: var(--paper);
    cursor: pointer;
    transition: all 180ms ease;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
  }
  .gallery-dropzone:hover, .gallery-dropzone.dragover {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .gallery-dropzone.dragover {
    transform: scale(1.008);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .gallery-dropzone svg {
    color: var(--accent);
    transition: transform 200ms ease;
  }
  .gallery-dropzone:hover svg, .gallery-dropzone.dragover svg {
    transform: translateY(-3px) scale(1.08);
  }
  .gallery-dropzone-text {
    font-size: 13.5px;
    color: var(--fg);
  }
  .gallery-dropzone-text .browse-link {
    color: var(--accent);
    text-decoration: underline;
    font-weight: 600;
  }
  .gallery-dropzone-sub {
    font-size: 11.5px;
    color: var(--muted);
  }

  /* Gallery Progress Bar */
  .gallery-progress {
    margin-bottom: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--paper);
    border: 1px solid var(--border);
  }
  .gallery-progress-bar {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .gallery-progress-fill {
    width: 0%;
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 220ms ease;
  }
  .gallery-progress-text {
    font-size: 12px;
    font-weight: 500;
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .gallery-spinner {
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 700ms linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .gallery-grid.dragover { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 8px; }
  .gallery-tile { position: relative; aspect-ratio: 4/3; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--paper); display: grid; place-items: center; cursor: grab; user-select: none; transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease; }
  .gallery-tile:active { cursor: grabbing; }
  .gallery-tile.dragging { opacity: 0.35; transform: scale(0.95); border: 2px dashed var(--accent); }
  .gallery-tile.drag-over { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); transform: scale(1.02); }
  .gallery-tile img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .gallery-tile .tile-num { position: absolute; bottom: 6px; left: 6px; font-size: 10px; font-family: var(--font-mono); background: rgba(0,0,0,0.68); color: #fff; padding: 2px 6px; border-radius: 3px; pointer-events: none; backdrop-filter: blur(4px); }
  .gallery-tile.add { cursor: pointer; color: var(--muted); font-size: 12px; border: 2px dashed var(--border); display: flex; flex-direction: column; gap: 4px; }
  .gallery-tile.add:hover, .gallery-tile.add.dragover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .gallery-tile .remove-btn { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 999px; background: rgba(0,0,0,0.72); color: #fff; border: 0; cursor: pointer; display: grid; place-items: center; opacity: 0; transition: opacity 160ms ease, background 160ms ease, transform 160ms ease; font-size: 11px; z-index: 2; }
  .gallery-tile:hover .remove-btn { opacity: 1; }
  .gallery-tile .remove-btn:hover { background: #d54545; transform: scale(1.1); }

  .actions { display: flex; gap: 10px; padding: 18px 0 0; position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 80%, transparent); padding-bottom: 12px; z-index: 5; flex-wrap: wrap; }
  .actions .right { margin-left: auto; display: flex; gap: 10px; }

  .empty {
    border: 2px dashed var(--border); border-radius: 6px; padding: 60px 24px; text-align: center;
    color: var(--muted);
  }
  .empty h3 { font-family: var(--font-sans); font-weight: 600; font-size: 28px; color: var(--fg); margin: 0 0 8px; }

  /* dialogs */
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-size: 13px; z-index: 100; opacity: 0; transition: opacity 220ms ease, transform 220ms ease; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, -8px); }

  @media (max-width: 900px) {
    .admin-shell { grid-template-columns: 1fr; }
    .admin-side { position: static; max-height: none; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    .admin-main { padding: 24px 20px 80px; }
  }
</style>
</head>
<body>

  <nav class="nav">
    <a class="nav-brand" href="../">
      <div class="mark">h</div>
      <span>Hasan Waulat<span style="color: var(--muted); margin-left: 8px;">— Project CMS</span></span>
    </a>
    <div class="nav-links">
      <a href="index.html">CMS Home</a>
      <a href="site.html">Site Content</a>
      <a href="../projects/index.html">All Projects (public)</a>
      <a href="../">Live Site</a>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <a class="btn" href="../projects/index.html">View public archive →</a>
    </div>
  </nav>

  <div class="admin-shell">
    <aside class="admin-side">
      <div class="side-head">
        <h2>Projects</h2>
        <span class="count" id="countLabel">0</span>
      </div>
      <div class="toolbar">
        <button class="btn btn-primary" id="addBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Add new project
        </button>
        <div class="toolbar-row">
          <button class="btn" id="exportBtn" title="Download all projects as JSON">Export</button>
          <button class="btn" id="importBtn" title="Restore projects from JSON file">Import</button>
        </div>
        <button class="btn" id="resetBtn" style="font-size: 12px; padding: 8px 10px;" title="Restore the original seed data — your changes will be lost">Reset to defaults</button>
        <input type="file" id="importFile" accept="application/json" style="display:none" />
      </div>
      <ul class="sidelist" id="sidelist"></ul>
    </aside>

    <main class="admin-main">
      <div id="mainContent"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../image-upload.js"></script>
  <script src="../projects/store.js"></script>
  <script>
    /* ===== Theme ===== */
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const sun = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
    const moon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    function setTheme(t){ root.setAttribute('data-theme', t); try{ localStorage.setItem('theme', t); }catch(e){} themeBtn.innerHTML = t === 'dark' ? sun : moon; }
    const saved = (()=>{ try { return localStorage.getItem('theme'); } catch(e){ return null; }})();
    setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    themeBtn.addEventListener('click', () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

    /* ===== State ===== */
    let projects = ProjectStore.load();
    let activeId = projects[0]?.id || null;
    let draft = null; // working copy of the selected project

    /* ===== Toast ===== */
    const toastEl = document.getElementById('toast');
    let toastTimer;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
    }

    /* ===== Sidebar ===== */
    let draggedId = null;

    function renderSidebar() {
      const list = document.getElementById('sidelist');
      document.getElementById('countLabel').textContent = projects.length;
      list.innerHTML = projects.map(p => `
        <li data-id="${p.id}" class="${p.id === activeId ? 'active' : ''}" draggable="true">
          <span class="num" style="cursor: grab;" title="Drag to reorder">≡</span>
          <div class="body">
            <div class="title">${escapeHtml(p.t)}</div>
            <div class="meta">${escapeHtml(p.c)}</div>
          </div>
          ${p.featured ? '<span class="star">★</span>' : ''}
        </li>
      `).join('');
      
      list.querySelectorAll('li').forEach(li => {
        li.addEventListener('click', () => selectProject(li.dataset.id));
        
        // Drag events for reordering
        li.addEventListener('dragstart', (e) => {
          draggedId = li.dataset.id;
          e.dataTransfer.effectAllowed = 'move';
          li.style.opacity = '0.4';
        });
        
        li.addEventListener('dragend', () => {
          li.style.opacity = '1';
          list.querySelectorAll('li').forEach(x => x.style.borderTop = '');
        });
        
        li.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });
        
        li.addEventListener('dragenter', (e) => {
          if (li.dataset.id !== draggedId) {
            li.style.borderTop = '2px solid var(--accent)';
          }
        });
        
        li.addEventListener('dragleave', () => {
          li.style.borderTop = '';
        });
        
        li.addEventListener('drop', (e) => {
          e.preventDefault();
          li.style.borderTop = '';
          const targetId = li.dataset.id;
          if (draggedId && draggedId !== targetId) {
            const oldIdx = projects.findIndex(p => p.id === draggedId);
            const newIdx = projects.findIndex(p => p.id === targetId);
            const item = projects.splice(oldIdx, 1)[0];
            projects.splice(newIdx, 0, item);
            ProjectStore.reorder(projects.map(p => p.id));
            renderSidebar();
          }
        });
      });
    }

    /* ===== Main panel ===== */
    function selectProject(id) {
      // commit any pending changes? We auto-save on each edit, so just switch.
      activeId = id;
      const p = projects.find(x => x.id === id);
      draft = p ? JSON.parse(JSON.stringify(p)) : null;
      renderSidebar();
      renderMain();
    }

    function renderMain() {
      const root = document.getElementById('mainContent');
      if (!draft) {
        root.innerHTML = `
          <div class="empty">
            <h3>No project selected</h3>
            <p>Add a new project or pick one from the list.</p>
          </div>`;
        return;
      }
      root.innerHTML = `
        <div class="crumbs">Editing project · ${escapeHtml(draft.n || '')}</div>
        <h1>${escapeHtml(draft.t)}</h1>
        <div class="status" id="statusLine"></div>

        <div class="panel">
          <div class="panel-head"><h3>Card &amp; basics</h3><span class="hint">Shown on the home archive and all-projects list</span></div>
          <div class="panel-body">
            <div class="grid-2">
              <div class="fld"><label>Title</label><input id="f-t" value="${attr(draft.t)}" /></div>
              <div class="fld"><label>Year</label><input id="f-y" value="${attr(draft.y)}" /></div>
              <div class="fld"><label>Client / Industry (card meta)</label><input id="f-c" value="${attr(draft.c)}" placeholder="e.g. PT. Ragdalion · Government" /></div>
              <div class="fld"><label>Card number (Auto-numbered)</label><input id="f-n" value="${attr(draft.n)}" disabled placeholder="01" /></div>
              <div class="fld full"><label>Short description (card)</label><textarea id="f-d">${escapeHtml(draft.d)}</textarea></div>
              <div class="fld"><label>Display chips (comma-separated)</label><input id="f-display" value="${attr((draft.display||[]).join(', '))}" placeholder="Mobile, Web, Government" /><span class="help">Visible as chips on the card. e.g. Mobile, Web Admin, iPad</span></div>
              <div class="fld"><label>Filter tags (comma-separated)</label><input id="f-tags" value="${attr((draft.tags||[]).join(', '))}" placeholder="mobile, web, government" /><span class="help">Lowercase slugs for filtering. Match the filter buttons: mobile, web, ipad, design-system, government, hr-tech, edu-tech</span></div>
              <div class="fld full"><label>Card mini-chips (comma-separated)</label><input id="f-chips" value="${attr((draft.chips||[]).join(', '))}" placeholder="Featured, Multi-surface" /></div>
            </div>
            <div style="margin-top: 14px;" class="toggle">
              <input type="checkbox" id="f-featured" ${draft.featured ? 'checked' : ''} />
              <div>
                <label for="f-featured">Show on home page "Projects handled" grid</label>
                <div class="desc">Only featured projects appear on the home archive section. The "All projects" page shows everything.</div>
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3>Cover image</h3><span class="hint">Used on cards and detail hero</span></div>
          <div class="panel-body">

      `;
      bindForm();
      renderSections();
      renderGallery();
      bindCover();

    /* ===== Bindings ===== */
    function bindForm() {
      const map = {
        't': 't', 'y': 'y', 'c': 'c', 'n': 'n', 'd': 'd',
        'headline': 'headline', 'lead': 'lead',
        'client': 'client', 'industry': 'industry', 'role': 'role',
        'team': 'team', 'surfaces': 'surfaces', 'timeline': 'timeline',
        'cover': 'cover',
        'cs_summary': 'cs_summary',
        'cs_overview': 'cs_overview',
        'cs_problem': 'cs_problem',
        'cs_scope': 'cs_scope',
        'cs_research': 'cs_research',
        'cs_ideation': 'cs_ideation',
        'cs_ui_design': 'cs_ui_design',
        'cs_prototype': 'cs_prototype',
        'cs_validation': 'cs_validation',
        'cs_handoff': 'cs_handoff',
        'cs_impact': 'cs_impact',
        'cs_reflection': 'cs_reflection',
        'cs_credit': 'cs_credit'
      };
      Object.entries(map).forEach(([id, key]) => {
        const el = document.getElementById('f-' + id);
        if (!el) return;
        el.addEventListener('input', () => { draft[key] = el.value; });
        el.addEventListener('blur', () => {
          if (key === 't') {
            document.querySelector('.admin-main h1').textContent = draft.t || 'Untitled';
          }
        });
      });
      // arrays
      ['display', 'tags', 'chips'].forEach(key => {
        const el = document.getElementById('f-' + key);
        if (!el) return;
        el.addEventListener('input', () => {
          draft[key] = el.value.split(',').map(s => s.trim()).filter(Boolean);
        });
      });
      // featured toggle
      document.getElementById('f-featured').addEventListener('change', (e) => {
        draft.featured = e.target.checked;
      });
      // actions
      document.getElementById('saveBtn').addEventListener('click', commit);
      document.getElementById('deleteBtn').addEventListener('click', deleteCurrent);
    }

    function renderSections() {
      const root = document.getElementById('sectionsList');
      root.innerHTML = (draft.sections || []).map((s, i) => sectionHTML(s, i)).join('');
      root.querySelectorAll('.section-editor').forEach(el => {
        const i = parseInt(el.dataset.idx, 10);
        bindSection(el, i);
      });
      document.getElementById('addParagraph').onclick = () => {
        draft.sections.push({ type: 'paragraph', heading: 'New section', body: '' });
        renderSections();
      };
      document.getElementById('addList').onclick = () => {
        draft.sections.push({ type: 'list', heading: 'New list', items: [''] });
        renderSections();
      };
    }

    function sectionHTML(s, i) {
      if (s.type === 'list') {
        return `
          <div class="section-editor" data-idx="${i}">
            <div class="se-head">
              <select data-act="type">
                <option value="paragraph" ${s.type === 'paragraph' ? 'selected' : ''}>Paragraph</option>
                <option value="list" ${s.type === 'list' ? 'selected' : ''}>List</option>
              </select>
              <input data-act="heading" value="${attr(s.heading)}" placeholder="Section heading" />
              <button class="icon-btn" data-act="up" title="Move up">↑</button>
              <button class="icon-btn" data-act="down" title="Move down">↓</button>
              <button class="icon-btn" data-act="delete" title="Delete">✕</button>
            </div>
            <div class="list-rows">
              ${(s.items || []).map((item, j) => `
                <div class="list-row">
                  <input data-act="item" data-idx="${j}" value="${attr(item)}" />
                  <button data-act="remove-item" data-idx="${j}">−</button>
                </div>`).join('')}
            </div>
            <button class="add-row" data-act="add-item">+ Add bullet</button>
          </div>`;
      }
      return `
        <div class="section-editor" data-idx="${i}">
          <div class="se-head">
            <select data-act="type">
              <option value="paragraph" ${s.type === 'paragraph' ? 'selected' : ''}>Paragraph</option>
              <option value="list" ${s.type === 'list' ? 'selected' : ''}>List</option>
            </select>
            <input data-act="heading" value="${attr(s.heading)}" placeholder="Section heading" />
            <button class="icon-btn" data-act="up" title="Move up">↑</button>
            <button class="icon-btn" data-act="down" title="Move down">↓</button>
            <button class="icon-btn" data-act="delete" title="Delete">✕</button>
          </div>
          <textarea data-act="body">${escapeHtml(s.body || '')}</textarea>
        </div>`;
    }

    function bindSection(el, i) {
      el.querySelector('[data-act="heading"]').addEventListener('input', e => { draft.sections[i].heading = e.target.value; });
      el.querySelector('[data-act="type"]').addEventListener('change', e => {
        const newType = e.target.value;
        if (newType === 'list' && draft.sections[i].type === 'paragraph') {
          draft.sections[i] = { type: 'list', heading: draft.sections[i].heading, items: draft.sections[i].body ? [draft.sections[i].body] : [''] };
        } else if (newType === 'paragraph' && draft.sections[i].type === 'list') {
          draft.sections[i] = { type: 'paragraph', heading: draft.sections[i].heading, body: (draft.sections[i].items || []).join(' ') };
        }
        renderSections();
      });
      el.querySelector('[data-act="up"]').addEventListener('click', () => {
        if (i === 0) return;
        [draft.sections[i-1], draft.sections[i]] = [draft.sections[i], draft.sections[i-1]];
        renderSections();
      });
      el.querySelector('[data-act="down"]').addEventListener('click', () => {
        if (i >= draft.sections.length - 1) return;
        [draft.sections[i+1], draft.sections[i]] = [draft.sections[i], draft.sections[i+1]];
        renderSections();
      });
      el.querySelector('[data-act="delete"]').addEventListener('click', () => {
        if (!confirm('Delete this section?')) return;
        draft.sections.splice(i, 1);
        renderSections();
      });
      const body = el.querySelector('[data-act="body"]');
      if (body) body.addEventListener('input', e => { draft.sections[i].body = e.target.value; });
      el.querySelectorAll('[data-act="item"]').forEach(input => {
        input.addEventListener('input', e => {
          const j = parseInt(input.dataset.idx, 10);
          draft.sections[i].items[j] = e.target.value;
        });
      });
      el.querySelectorAll('[data-act="remove-item"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const j = parseInt(btn.dataset.idx, 10);
          draft.sections[i].items.splice(j, 1);
          renderSections();
        });
      });
      const addItem = el.querySelector('[data-act="add-item"]');
      if (addItem) addItem.addEventListener('click', () => {
        draft.sections[i].items.push('');
        renderSections();
      });
    }

    /* ===== Cover image ===== */
    function bindCover() {
      const slot = document.getElementById('coverSlot');
      const input = document.getElementById('coverInput');
      const remove = document.getElementById('coverRemove');
      slot.addEventListener('click', (e) => {
        if (e.target.closest('button.remove-btn')) return;
        input.click();
      });
      input.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const url = await ProjectStore.fileToCompressedDataURL(file, 1600, 0.82);
          draft.coverImage = url;
          renderMain();
        } catch (err) {
          toast('Image upload failed: ' + err.message);
        }
      });
      // drag and drop
      ['dragenter', 'dragover'].forEach(ev => slot.addEventListener(ev, e => { e.preventDefault(); slot.classList.add('dragover'); }));
      ['dragleave', 'drop'].forEach(ev => slot.addEventListener(ev, e => { e.preventDefault(); slot.classList.remove('dragover'); }));
      slot.addEventListener('drop', async e => {
        const file = e.dataTransfer.files[0];
        if (!file) return;
        try {
          const url = await ProjectStore.fileToCompressedDataURL(file, 1600, 0.82);
          draft.coverImage = url;
          renderMain();
        } catch (err) { toast('Failed: ' + err.message); }
      });
      if (remove) remove.addEventListener('click', (e) => {
        e.stopPropagation();
        draft.coverImage = '';
        renderMain();
      });
    }

    /* ===== Design System Image ===== */
    function bindDesignSystem() {
      const slot = document.getElementById('dsSlot');
      const input = document.getElementById('dsInput');
      const remove = document.getElementById('dsRemove');
      if (!slot) return;
      slot.addEventListener('click', (e) => {
        if (e.target.closest('button.remove-btn')) return;
        input.click();
      });
      input.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const url = await ProjectStore.fileToCompressedDataURL(file, 2560, 0.9);
          draft.cs_design_system = url;
          renderMain();
        } catch (err) {
          toast('Image upload failed: ' + err.message);
        }
      });
      // drag and drop
      ['dragenter', 'dragover'].forEach(ev => slot.addEventListener(ev, e => { e.preventDefault(); slot.classList.add('dragover'); }));
      ['dragleave', 'drop'].forEach(ev => slot.addEventListener(ev, e => { e.preventDefault(); slot.classList.remove('dragover'); }));
      slot.addEventListener('drop', async e => {
        const file = e.dataTransfer.files[0];
        if (!file) return;
        try {
          const url = await ProjectStore.fileToCompressedDataURL(file, 2560, 0.9);
          draft.cs_design_system = url;
          renderMain();
        } catch (err) { toast('Failed: ' + err.message); }
      });
      if (remove) remove.addEventListener('click', (e) => {
        e.stopPropagation();
        draft.cs_design_system = '';
        renderMain();
      });
    }

    let draggedGalleryIdx = null;

    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      const dropzone = document.getElementById('galleryDropzone');
      const input = document.getElementById('galleryInput');
      const totalCountEl = document.getElementById('galleryTotalCount');
      const countHint = document.getElementById('galleryCountHint');

      if (!grid) return;
      draft.gallery = draft.gallery || [];

      // Update counters
      const countStr = draft.gallery.length === 1 ? '1 image' : `${draft.gallery.length} images`;
      if (totalCountEl) totalCountEl.textContent = countStr;
      if (countHint) countHint.textContent = draft.gallery.length ? `${countStr} · Screen captures on detail page` : 'Screen captures shown on the detail page';

      // Build tiles
      const tiles = draft.gallery.map((src, i) => `
        <div class="gallery-tile" draggable="true" data-idx="${i}" title="Drag to reorder">
          <img src="${src}" alt="Screen ${i + 1}" loading="lazy" />
          <span class="tile-num">#${i + 1}</span>
          <button class="remove-btn" data-idx="${i}" title="Delete image" type="button">✕</button>
        </div>`).join('');

      grid.innerHTML = tiles + `
        <div class="gallery-tile add" id="galleryAdd" title="Click or drop images here">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>+ Add images</span>
        </div>`;

      // Wire tile remove buttons
      grid.querySelectorAll('.remove-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.idx, 10);
          draft.gallery.splice(idx, 1);
          renderGallery();
        };
      });

      // Wire tile drag-to-reorder
      const tileEls = grid.querySelectorAll('.gallery-tile:not(.add)');
      tileEls.forEach(tile => {
        tile.ondragstart = (e) => {
          draggedGalleryIdx = parseInt(tile.dataset.idx, 10);
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(draggedGalleryIdx));
          tile.classList.add('dragging');
        };
        tile.ondragend = () => {
          draggedGalleryIdx = null;
          tile.classList.remove('dragging');
          grid.querySelectorAll('.gallery-tile').forEach(t => t.classList.remove('drag-over'));
        };
        tile.ondragover = (e) => {
          if (draggedGalleryIdx === null) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          tile.classList.add('drag-over');
        };
        tile.ondragleave = () => {
          tile.classList.remove('drag-over');
        };
        tile.ondrop = (e) => {
          if (draggedGalleryIdx === null) return;
          e.preventDefault();
          e.stopPropagation();
          tile.classList.remove('drag-over');
          const targetIdx = parseInt(tile.dataset.idx, 10);
          if (!isNaN(targetIdx) && targetIdx !== draggedGalleryIdx) {
            const item = draft.gallery.splice(draggedGalleryIdx, 1)[0];
            draft.gallery.splice(targetIdx, 0, item);
            draggedGalleryIdx = null;
            renderGallery();
          }
        };
      });

      // Upload handler for multiple files
      async function uploadMultipleFiles(fileList) {
        const files = Array.from(fileList || []).filter(f => f.type && f.type.startsWith('image/'));
        if (!files.length) {
          toast('Please choose image files (PNG, JPG, WEBP).');
          return;
        }

        const progress = document.getElementById('galleryProgress');
        const progressFill = document.getElementById('galleryProgressFill');
        const progressText = document.getElementById('galleryProgressText');
        const saveBtn = document.getElementById('saveBtn');

        if (progress) progress.style.display = 'block';
        if (saveBtn) saveBtn.disabled = true;

        let success = 0;
        let fail = 0;

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const pct = Math.round((i / files.length) * 100);
          if (progressFill) progressFill.style.width = pct + '%';
          if (progressText) {
            progressText.innerHTML = `<span class="gallery-spinner"></span><span>Uploading ${i + 1} of ${files.length} (${file.name})...</span>`;
          }

          try {
            const url = await ProjectStore.fileToCompressedDataURL(file, 1600, 0.82);
            draft.gallery.push(url);
            success++;
            renderGallery();
          } catch (err) {
            console.error('Gallery image upload failed:', file.name, err);
            fail++;
          }
        }

        if (progressFill) progressFill.style.width = '100%';
        if (progressText) {
          progressText.innerHTML = `<span>✓ Completed: ${success} uploaded${fail ? `, ${fail} failed` : ''}</span>`;
        }
        setTimeout(() => {
          if (progress) progress.style.display = 'none';
          if (progressFill) progressFill.style.width = '0%';
        }, 1800);

        if (saveBtn) saveBtn.disabled = false;
        toast(`✓ Uploaded ${success} image${success > 1 ? 's' : ''}${fail ? ` (${fail} failed)` : ''}`);
      }

      function isFileTransfer(e) {
        return e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
      }

      // Wire dropzone click & drag-and-drop
      if (dropzone) {
        dropzone.onclick = () => input.click();
        dropzone.ondragenter = (e) => {
          if (!isFileTransfer(e)) return;
          e.preventDefault();
          dropzone.classList.add('dragover');
        };
        dropzone.ondragover = (e) => {
          if (!isFileTransfer(e)) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'copy';
          dropzone.classList.add('dragover');
        };
        dropzone.ondragleave = (e) => {
          dropzone.classList.remove('dragover');
        };
        dropzone.ondrop = (e) => {
          if (!isFileTransfer(e)) return;
          e.preventDefault();
          e.stopPropagation();
          dropzone.classList.remove('dragover');
          if (e.dataTransfer.files && e.dataTransfer.files.length) {
            uploadMultipleFiles(e.dataTransfer.files);
          }
        };
      }

      // Wire grid as file drop target
      grid.ondragover = (e) => {
        if (!isFileTransfer(e)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        grid.classList.add('dragover');
      };
      grid.ondragleave = (e) => {
        if (e.relatedTarget && grid.contains(e.relatedTarget)) return;
        grid.classList.remove('dragover');
      };
      grid.ondrop = (e) => {
        if (!isFileTransfer(e)) return;
        e.preventDefault();
        e.stopPropagation();
        grid.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files.length) {
          uploadMultipleFiles(e.dataTransfer.files);
        }
      };

      // Wire "+ Add images" tile click & drop
      const addTile = document.getElementById('galleryAdd');
      if (addTile) {
        addTile.onclick = () => input.click();
        addTile.ondragover = (e) => {
          if (!isFileTransfer(e)) return;
          e.preventDefault();
          addTile.classList.add('dragover');
        };
        addTile.ondragleave = () => addTile.classList.remove('dragover');
        addTile.ondrop = (e) => {
          if (!isFileTransfer(e)) return;
          e.preventDefault();
          e.stopPropagation();
          addTile.classList.remove('dragover');
          if (e.dataTransfer.files && e.dataTransfer.files.length) {
            uploadMultipleFiles(e.dataTransfer.files);
          }
        };
      }

      // Wire input file picker
      if (input) {
        input.onchange = (e) => {
          if (e.target.files && e.target.files.length) {
            uploadMultipleFiles(e.target.files);
            input.value = '';
          }
        };
      }
    }

    /* ===== Commit ===== */
    function commit() {
      // ensure slug-safe id
      if (!draft.id) draft.id = 'project-' + Date.now();
      const result = ProjectStore.upsert(draft);
      if (!result.ok) {
        toast('Save failed — ' + result.error);
        return;
      }
      projects = ProjectStore.load();
      renderSidebar();
      toast('Saved. ✓');
      const status = document.getElementById('statusLine');
      if (status) status.textContent = 'Last saved ' + new Date().toLocaleTimeString();
    }

    function deleteCurrent() {
      if (!confirm('Delete "' + draft.t + '"? This cannot be undone (you can still Reset to defaults).')) return;
      ProjectStore.remove(draft.id);
      projects = ProjectStore.load();
      activeId = projects[0]?.id || null;
      draft = activeId ? JSON.parse(JSON.stringify(projects.find(p => p.id === activeId))) : null;
      renderSidebar();
      renderMain();
      toast('Project deleted.');
    }

    /* ===== Toolbar ===== */
    document.getElementById('addBtn').addEventListener('click', () => {
      const fresh = ProjectStore.blank();
      ProjectStore.upsert(fresh);
      projects = ProjectStore.load();
      selectProject(fresh.id);
      toast('New project added.');
    });
    document.getElementById('exportBtn').addEventListener('click', () => {
      ProjectStore.exportJSON();
      toast('Exported to JSON.');
    });
    document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
    document.getElementById('importFile').addEventListener('change', async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try {
        await ProjectStore.importJSON(f);
        projects = ProjectStore.load();
        activeId = projects[0]?.id || null;
        selectProject(activeId);
        toast('Imported successfully.');
      } catch (err) { toast('Import failed: ' + err.message); }
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (!confirm('Reset everything to the original seed data? Your custom projects and images will be lost.')) return;
      ProjectStore.reset();
      projects = ProjectStore.load();
      activeId = projects[0]?.id || null;
      selectProject(activeId);
      toast('Reset to defaults.');
    });

    /* ===== Utils ===== */
    function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
    function attr(s) { return escapeHtml(s); }

    /* ===== Init ===== */
    if (activeId) selectProject(activeId);
    else renderMain();
    renderSidebar();

    /* When cloud data arrives (initial pull from Supabase), reload the
       project list so the editor reflects the shared content. */
    window.addEventListener('hw-cloud-applied', () => {
      projects = ProjectStore.load();
      if (!projects.find(p => p.id === activeId)) activeId = projects[0] ? projects[0].id : null;
      if (activeId) selectProject(activeId);
      else { draft = null; renderMain(); }
      renderSidebar();
    });
  </script>
</body>
</html>
